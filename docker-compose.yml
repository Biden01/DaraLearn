name: daralearn

# Ротация логов на случай, если на хосте нет (или изменится) дефолтной
# настройки Docker-демона (/etc/docker/daemon.json) — держим лимит в репо,
# а не только в хостовом конфиге.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: daralearn
      POSTGRES_USER: daralearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daralearn"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://daralearn:${POSTGRES_PASSWORD}@db:5432/daralearn
    depends_on:
      db:
        condition: service_healthy
    # Наружу не публикуем: снаружи доступ только через nginx.
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
